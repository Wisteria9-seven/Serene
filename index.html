<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seren</title>
<style>
:root{--wx:#ededed;--line:#dcdcdc;--text:#191919;--muted:#8b8b8b;--green:#95d475;--white:#fff;--panel:#f7f7f7;--shadow:0 10px 35px rgba(0,0,0,.12)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",Arial,sans-serif;color:var(--text);background:#d8d8d8}button,input,textarea{font:inherit}button{border:0;cursor:pointer}
.app{width:min(760px,100vw);height:min(900px,100dvh);margin:auto;background:var(--wx);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);position:relative}
.topbar{height:64px;flex:none;background:#f7f7f7;border-bottom:1px solid #d5d5d5;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:5}.top-left{display:flex;align-items:center;gap:12px;min-width:0}.back{font-size:29px;font-weight:300;line-height:1;color:#222;padding:5px 8px}.title{min-width:0}.title h1{font-size:17px;line-height:1.2;margin:0;font-weight:600}.title p{font-size:11px;color:#999;margin:3px 0 0}.head-actions{display:flex;gap:2px}.head-btn{width:42px;height:42px;background:transparent;font-size:23px;color:#333;border-radius:8px}.head-btn:active{background:#e9e9e9}
.avatar{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;flex:none;background:#8d7867;color:#fff;font-weight:600;font-size:18px;overflow:hidden}.my-avatar{background:#6d8f64}.top-avatar{width:42px;height:42px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:16px 15px 20px;background:#ededed;scroll-behavior:smooth}.day{width:max-content;margin:2px auto 18px;color:#a0a0a0;font-size:11px;background:#e2e2e2;border-radius:4px;padding:4px 8px}.msg{display:flex;align-items:flex-start;gap:9px;margin:0 0 15px}.msg.me{flex-direction:row-reverse}.msg .avatar{width:42px;height:42px}.msg-body{max-width:calc(100% - 54px);display:flex;flex-direction:column}.msg.me .msg-body{align-items:flex-end}.bubble{position:relative;max-width:min(500px,72vw);padding:10px 12px;border-radius:5px;background:#fff;border:1px solid rgba(0,0,0,.035);font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.025)}.msg.ta .bubble:before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;background:#fff;transform:rotate(45deg);border-left:1px solid rgba(0,0,0,.035);border-bottom:1px solid rgba(0,0,0,.035)}.msg.me .bubble{background:var(--green);border-color:rgba(0,0,0,.025)}.msg.me .bubble:before{content:"";position:absolute;right:-6px;top:12px;width:10px;height:10px;background:var(--green);transform:rotate(45deg);border-top:1px solid rgba(0,0,0,.025);border-right:1px solid rgba(0,0,0,.025)}.meta{font-size:10px;color:#aaa;margin-top:4px;padding:0 2px}
.composer{flex:none;background:#f7f7f7;border-top:1px solid #d5d5d5;padding:9px 10px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px;z-index:6}.tool{width:42px;height:42px;border-radius:7px;background:transparent;color:#555;font-size:27px;flex:none}.tool:active{background:#e7e7e7}.input-wrap{flex:1;min-width:0;background:#fff;border:1px solid #d7d7d7;border-radius:6px;display:flex;align-items:flex-end;min-height:42px}.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;padding:9px 10px;font-size:16px;line-height:1.45;min-height:40px;max-height:120px}.send{height:40px;padding:0 14px;border-radius:6px;background:#07c160;color:#fff;font-size:14px;font-weight:500;flex:none}.send:disabled{background:#c8c8c8;color:#fff}.hint{display:none}
.drawer{position:absolute;right:0;top:0;width:min(390px,92vw);height:100%;background:#f7f7f7;z-index:20;transform:translateX(105%);transition:transform .25s ease;box-shadow:-8px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawer-head{height:64px;flex:none;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.drawer-head h2{font-size:17px;margin:0}.close{font-size:26px;background:transparent}.drawer-scroll{overflow:auto;padding:15px}.card-form,.deck{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px;margin-bottom:12px}.card-form h3,.deck h3{font-size:14px;margin:0 0 9px}.field label{font-size:12px;color:#777;display:block;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #ddd;border-radius:6px;background:#fafafa;padding:9px;outline:none}.field textarea{resize:vertical;min-height:78px}.primary{width:100%;height:40px;border-radius:6px;background:#07c160;color:#fff;margin-top:9px}.profile-row{display:flex;gap:10px}.profile-row .field{flex:1}.card-count{font-weight:400;color:#999}.card-list{display:flex;flex-direction:column;gap:8px}.card-item{position:relative;padding:10px 35px 10px 11px;border-radius:6px;background:#f7f7f7;border:1px solid #e6e6e6;font-size:13px;line-height:1.5}.del{position:absolute;right:8px;top:7px;background:transparent;color:#999;font-size:18px}.empty{padding:15px 5px;text-align:center;color:#aaa;font-size:12px}.overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:15;display:none}.overlay.show{display:block}
@media (max-width:760px){
  html,body{
    width:100%;
    min-width:0;
    max-width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    background:#ededed;
    -webkit-text-size-adjust:100%;
  }
  .app{
    width:100%;
    max-width:100%;
    height:100dvh;
    min-height:100svh;
    margin:0;
    box-shadow:none;
    overflow:hidden;
  }
  .topbar{
    height:56px;
    min-height:56px;
    padding:0 8px;
  }
  .top-left{
    gap:7px;
  }
  .back{
    width:38px;
    height:42px;
    padding:3px 6px;
    font-size:28px;
  }
  .top-avatar{
    width:38px;
    height:38px;
  }
  .title h1{
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:46vw;
  }
  .title p{font-size:10px}
  .head-actions{gap:0}
  .head-btn{
    width:38px;
    height:42px;
    font-size:21px;
  }

  .messages{
    width:100%;
    min-width:0;
    padding:12px 9px calc(18px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .day{
    margin-bottom:15px;
  }
  .msg{
    width:100%;
    min-width:0;
    gap:8px;
    margin-bottom:13px;
  }
  .msg .avatar{
    width:38px;
    height:38px;
    min-width:38px;
    font-size:16px;
    border-radius:6px;
  }
  .msg-body{
    min-width:0;
    max-width:calc(100% - 46px);
  }
  .bubble{
    max-width:calc(100vw - 92px);
    padding:9px 11px;
    font-size:16px;
    line-height:1.5;
    overflow-wrap:anywhere;
    word-break:break-word;
  }

  .composer{
    width:100%;
    min-width:0;
    min-height:58px;
    padding:7px 7px calc(7px + env(safe-area-inset-bottom));
    gap:5px;
    align-items:flex-end;
    /* Keep the composer above the iOS home indicator. */
    padding-bottom:max(7px, env(safe-area-inset-bottom));
  }
  .tool{
    width:34px;
    min-width:34px;
    height:40px;
    font-size:24px;
    padding:0;
  }
  .input-wrap{
    min-width:0;
    min-height:40px;
    max-width:none;
    border-radius:7px;
  }
  .composer textarea{
    min-height:38px;
    max-height:104px;
    padding:8px 9px;
    font-size:16px;
    line-height:1.4;
  }
  .send{
    min-width:52px;
    height:40px;
    padding:0 10px;
    font-size:14px;
    touch-action:manipulation;
  }

  .overlay{
    position:fixed;
    inset:0;
  }
  .drawer{
    position:fixed;
    top:0;
    right:0;
    width:min(100vw,390px);
    max-width:100%;
    height:100dvh;
    min-height:100svh;
    padding-bottom:env(safe-area-inset-bottom);
    transform:translateX(105%);
  }
  .drawer-head{
    height:56px;
    min-height:56px;
    padding:0 12px;
  }
  .close{
    width:42px;
    height:42px;
    font-size:27px;
    touch-action:manipulation;
  }
  .drawer-scroll{
    min-height:0;
    padding:10px;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .card-form,.deck{
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
  }
  .profile-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:8px;
  }
  .field input,.field textarea{
    min-width:0;
    font-size:16px; /* Prevent iOS Safari auto-zoom on focus. */
  }
  .field textarea{
    min-height:88px;
  }
  .primary{
    height:44px;
    min-height:44px;
    font-size:15px;
    touch-action:manipulation;
  }
  .card-item{
    padding:10px 40px 10px 11px;
    overflow-wrap:anywhere;
  }
  .del{
    width:34px;
    height:34px;
    right:3px;
    top:3px;
    font-size:20px;
    touch-action:manipulation;
  }
}

@media (max-width:360px){
  .title h1{max-width:39vw}
  .head-btn{width:34px}
  .tool{width:31px;min-width:31px;font-size:22px}
  .send{min-width:49px;padding:0 8px}
  .messages{padding-left:7px;padding-right:7px}
  .bubble{max-width:calc(100vw - 82px);font-size:15px}
  .msg .avatar{width:36px;height:36px;min-width:36px}
  .msg-body{max-width:calc(100% - 44px)}
}

@media (min-width:761px){
  body{
    min-width:320px;
    overflow:hidden;
  }
}

@supports (-webkit-touch-callout:none){
  @media (max-width:760px){
    .app{height:-webkit-fill-available;}
    .drawer{height:-webkit-fill-available;}
  }
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="top-left"><button class="back" id="backBtn" aria-label="返回">‹</button><div class="avatar top-avatar" id="headAvatar">T</div><div class="title"><h1 id="headName">TA</h1><p>在线</p></div></div>
  <div class="head-actions"><button class="head-btn" id="clearChat" title="清空聊天">⌫</button><button class="head-btn" id="openDrawer" title="设置">⋯</button></div>
</header>
<section class="messages" id="messages"></section>
<footer class="composer" id="composer">
  <button class="tool" title="语音">⌁</button>
  <div class="input-wrap"><textarea id="input" rows="1" placeholder="输入消息"></textarea></div>
  <button class="tool" id="emojiBtn" title="表情">☺</button>
  <button class="send" id="send">发送</button>
</footer>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h2>聊天设置</h2><button class="close" id="closeDrawer">×</button></div>
  <div class="drawer-scroll">
    <div class="card-form">
      <h3>聊天资料</h3>
      <div class="profile-row"><div class="field"><label>TA 的称呼</label><input id="nameInput" placeholder="TA"></div><div class="field"><label>TA 的头像</label><input id="avatarInput" maxlength="2" placeholder="T"></div></div>
      <div class="profile-row"><div class="field"><label>我的称呼</label><input id="myNameInput" placeholder="我"></div><div class="field"><label>我的头像</label><input id="myAvatarInput" maxlength="2" placeholder="我"></div></div>
      <div class="field" style="margin-top:10px"><label>聊天背景（颜色或图片 URL）</label><input id="bgInput" placeholder="例如 #ededed 或图片地址"></div>
      <button class="primary" id="saveProfile">保存聊天资料</button>
    </div>
    <div class="card-form">
      <h3>添加 TA 的专属字卡</h3>
      <div class="field"><label>批量添加：一行一张字卡</label><textarea id="cardInput" placeholder="嗯，我在。
怎么了？
想我了？
我陪你。

空行会自动忽略"></textarea></div>
      <div style="display:flex;gap:8px;margin-top:9px">
        <button class="primary" id="addCard" style="margin-top:0;flex:1">批量添加</button>
        <button class="primary" id="clearCards" style="margin-top:0;flex:1;background:#fff;color:#07c160;border:1px solid #07c160">清空全部</button>
      </div>
      <div style="font-size:12px;color:#999;margin-top:8px">每一行会成为一张字卡；空行会自动忽略。</div>
    </div>
    <div class="deck"><h3>已保存的字卡 <span class="card-count" id="cardCount">（0）</span></h3><div class="card-list" id="deck"></div></div>
  </div>
</aside>
</div>
<script>
const STORAGE='private_chat_v1';
const defaults={profile:{name:'TA',avatar:'T',myName:'我',myAvatar:'我',background:''},cards:[],messages:[],allowRepeat:true,persist:true};
let state=load(); let lastCardIndex=-1;
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));return {...defaults,...s,profile:{...defaults.profile,...(s&&s.profile||{})},cards:Array.isArray(s&&s.cards)?s.cards:[],messages:Array.isArray(s&&s.messages)?s.messages:[]}}catch(e){return JSON.parse(JSON.stringify(defaults))}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clock(ts){return new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function renderProfile(){ $('headName').textContent=state.profile.name||'TA'; $('headAvatar').textContent=state.profile.avatar||'T'; $('nameInput').value=state.profile.name||'TA'; $('avatarInput').value=state.profile.avatar||'T'; $('myNameInput').value=state.profile.myName||'我'; $('myAvatarInput').value=state.profile.myAvatar||'我'; $('bgInput').value=state.profile.background||''; applyBackground(); }
function renderMessages(){const box=$('messages');box.innerHTML='<div class="day">今天</div>';state.messages.forEach(m=>{const row=document.createElement('div');row.className='msg '+(m.role==='me'?'me':'ta');const av=document.createElement('div');av.className='avatar';av.textContent=m.role==='me'?(state.profile.myAvatar||'我'):(state.profile.avatar||'T');if(m.role==='me')av.classList.add('my-avatar');const body=document.createElement('div');body.className='msg-body';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;const meta=document.createElement('div');meta.className='meta';meta.textContent=clock(m.ts); if(m.role==='me'){ meta.title=state.profile.myName||'我'; }body.append(bubble,meta);row.append(av,body);box.appendChild(row)});box.scrollTop=box.scrollHeight}
function renderDeck(){const list=$('deck');$('cardCount').textContent='（'+state.cards.length+'）';list.innerHTML='';if(!state.cards.length){list.innerHTML='<div class="empty">还没有字卡。添加后，TA 才能回复你。</div>';return}state.cards.forEach((c,i)=>{const item=document.createElement('div');item.className='card-item';item.textContent=c;const b=document.createElement('button');b.className='del';b.textContent='×';b.title='删除';b.onclick=()=>{state.cards.splice(i,1);save();renderDeck()};item.appendChild(b);list.appendChild(item)})}
function applyBackground(){const bg=state.profile.background||'';const box=$('messages'); if(/^https?:\/\//i.test(bg)||bg.startsWith('data:image/')){box.style.backgroundImage=`url(\"${bg.replace(/\"/g,'') }\")`;box.style.backgroundSize='cover';box.style.backgroundPosition='center';}else{box.style.backgroundImage='';box.style.backgroundColor=bg||'#ededed';}}
function render(){renderProfile();renderMessages();renderDeck()}
function pickCard(){if(!state.cards.length)return null;if(state.allowRepeat||state.cards.length===1)return state.cards[Math.floor(Math.random()*state.cards.length)];let i;do{i=Math.floor(Math.random()*state.cards.length)}while(i===lastCardIndex);lastCardIndex=i;return state.cards[i]}
function send(){const input=$('input'),text=input.value.trim();if(!text)return;if(!state.cards.length){openDrawer();setTimeout(()=>$('cardInput').focus(),120);return}state.messages.push({role:'me',text,ts:Date.now()});const reply=pickCard();state.messages.push({role:'ta',text:reply,ts:Date.now()+120});input.value='';input.style.height='auto';save();renderMessages()}
function openDrawer(){
  $('drawer').classList.add('open');
  $('overlay').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeDrawer(){
  $('drawer').classList.remove('open');
  $('overlay').classList.remove('show');
  document.body.style.overflow='hidden';
}
$('send').onclick=send;
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});

/* Mobile keyboard handling: keep the composer and latest messages visible
   without changing the persisted chat data. */
function syncKeyboardViewport(){
  const vv=window.visualViewport;
  if(!vv || window.innerWidth>760) return;
  const keyboardGap=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  document.documentElement.style.setProperty('--keyboard-gap', keyboardGap+'px');
  const composer=$('composer') || document.querySelector('.composer');
  if(composer){
    composer.style.transform = keyboardGap>0 ? `translateY(-${keyboardGap}px)` : '';
  }
  const box=$('messages');
  requestAnimationFrame(()=>{ box.scrollTop=box.scrollHeight; });
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',syncKeyboardViewport);
  window.visualViewport.addEventListener('scroll',syncKeyboardViewport);
}
window.addEventListener('resize',syncKeyboardViewport);
window.addEventListener('orientationchange',()=>setTimeout(syncKeyboardViewport,150));

$('openDrawer').onclick=openDrawer;$('closeDrawer').onclick=closeDrawer;$('overlay').onclick=closeDrawer;
$('backBtn').onclick=()=>{if(history.length>1)history.back();else window.scrollTo(0,0)};
$('clearChat').onclick=()=>{if(confirm('确定清空聊天记录吗？字卡不会被删除。')){state.messages=[];save();renderMessages()}};
$('saveProfile').onclick=()=>{state.profile.name=$('nameInput').value.trim()||'TA';state.profile.avatar=$('avatarInput').value.trim().slice(0,2)||'T';state.profile.myName=$('myNameInput').value.trim()||'我';state.profile.myAvatar=$('myAvatarInput').value.trim().slice(0,2)||'我';state.profile.background=$('bgInput').value.trim();save();renderProfile();renderMessages()};
$('addCard').onclick=()=>{
  const raw=$('cardInput').value.replace(/\r/g,'');
  const cards=raw.split('\n').map(v=>v.trim()).filter(Boolean);
  if(!cards.length)return;
  state.cards.push(...cards);
  $('cardInput').value='';
  save();
  renderDeck();
};
$('clearCards').onclick=()=>{
  if(!state.cards.length)return;
  if(confirm('确定清空全部字卡吗？聊天记录不会被删除。')){
    state.cards=[];
    lastCardIndex=-1;
    save();
    renderDeck();
  }
};
$('emojiBtn').onclick=()=>{$('input').value+='☺';$('input').focus();$('input').dispatchEvent(new Event('input'))};
render();
</script>
</body>
</html>
